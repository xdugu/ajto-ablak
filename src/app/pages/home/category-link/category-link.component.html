<div [ngClass]="screenType" style="overflow: hidden"  id="main-container">  
    <a class="w3-display-container" [routerLink]="['category'].concat(flow.link)" >
        <img [appLazyLoad]="imgSrc | imageSource : 1000" style="height: auto; width: 100%;">
        <h1 *ngIf="flow.title[lang] !== '**BLANK**'"
            class="w3-display-middle home-category-text my-background-primary" 
            [style.color]="flow.colour"
            [style]="'border: 2px solid ' + flow.colour">
            {{flow.title[lang]}}
        </h1>
    </a> 
</div>
